# Configuración oficial de Jekyll para GitHub Pages — AISUNI ✷
title: "AISUNI ✷ — Archivo Activo"
description: "Investigación en artes visuales y sistemas generativos: un espacio de experimentación con tecnologías emergentes y herramientas algorítmicas para nuevas inteligencias visuales."
url: "https://github.io"
baseurl: ""
timezone: "America/New_York" # 🗽 Set to New York Time
markdown: kramdown
future: true # Enforces publication even if a project date is set to later in 2026

# Colecciones desacopladas de contenido (.md)
collections:
  proyectos:
    output: true # ✅ Allows Jekyll to read and compile these files into your data loop
    sort_by: num
  archivo:
    output: true # ✅ Allows Jekyll to read and compile these files into your data loop

exclude:
  - README.md
  - LICENSE
  - .gitignore
