# Configuración oficial de Jekyll para GitHub Pages — AISUNI ✷
title: "AISUNI ✷ — Archivo Activo"
description: "Investigación en artes visuales y sistemas generativos: un espacio de experimentación con tecnologías emergentes y herramientas algorítmicas para nuevas inteligencias visuales."
url: ""
baseurl: ""
timezone: "America/New_York"
markdown: kramdown

# Colecciones de contenido (.md)
# Cualquier archivo .md editado o nuevo dentro de _proyectos/ o _archivo/
# es compilado automáticamente por Jekyll en cada commit.
collections:
  proyectos:
    output: true
  archivo:
    output: true

defaults:
  - scope:
      path: ""
      type: "proyectos"
    values:
      layout: null
  - scope:
      path: ""
      type: "archivo"
    values:
      layout: null

exclude:
  - README.md
  - LICENSE
  - .gitignore
  - sync_markdown.py
  - build_site.py
  - .github
