# Configuración oficial de Jekyll para GitHub Pages — AISUNI ✷
title: "AISUNI ✷ — Archivo Activo"
description: "Investigación en artes visuales y sistemas generativos: un espacio de experimentación con tecnologías emergentes y herramientas algorítmicas para nuevas inteligencias visuales."
url: "https://aisuni-lab.github.io" # 🌐 Fixed to match your correct organization/user sub-domain
baseurl: "/aisuni"                  # 📁 Fixed so Jekyll appends the correct subfolder pathway
timezone: "America/New_York"
markdown: kramdown
future: true

# Colecciones desacopladas de contenido (.md)
collections:
  proyectos:
    output: true
    sort_by: num
  archivo:
    output: true
    sort_by: num

exclude:
  - README.md
  - LICENSE
  - .gitignore
